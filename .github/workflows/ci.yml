name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install melt and ffmpeg (Linux, enables the real render tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y melt ffmpeg
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
