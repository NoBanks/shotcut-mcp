[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shotcut-mcp"
version = "0.2.0"
description = "MCP server for Shotcut/MLT video editing - programmatic timelines, cuts, filters, and renders via melt"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "shotcut", "mlt", "video-editing", "goose", "ai-agents"]
dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/NoBanks/shotcut-mcp"
Issues = "https://github.com/NoBanks/shotcut-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
shotcut-mcp = "shotcut_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shotcut_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
